
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>

    <h1>Calculadora</h1>

    <form id="formCalculadora">

        <label>Primeiro número:</label>
        <input type="number" id="numero1" step="any" required>

        <br><br>

        <label>Segundo número:</label>
        <input type="number" id="numero2" step="any" required>

        <br><br>

        <label>Operação:</label>
        <select id="operacao">
            <option value="soma">Soma (+)</option>
            <option value="subtracao">Subtração (-)</option>
            <option value="multiplicacao">Multiplicação (*)</option>
            <option value="divisao">Divisão (/)</option>
        </select>

        <br><br>

        <button type="submit">Calcular</button>

    </form>

    <h2 id="resultado"></h2>

    <script>

        document.getElementById("formCalculadora")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            // Pegando os valores do formulário
            let numero1 = document.getElementById("numero1").value;
            let numero2 = document.getElementById("numero2").value;
            let operacao = document.getElementById("operacao").value;

            // Organizando os dados para enviar ao PHP
            let dados = new FormData();

            dados.append("numero1", numero1);
            dados.append("numero2", numero2);
            dados.append("operacao", operacao);

            // Enviando os dados para o PHP
            fetch("calcular.php", {
                method: "POST",
                body: dados
            })

            // Recebendo a resposta em JSON
            .then(resposta => resposta.json())

            // Mostrando o resultado na página
            .then(dados => {

                if (dados.sucesso) {
                    document.getElementById("resultado").innerHTML =
                    "Resultado: " + dados.resultado;
                } else {
                    document.getElementById("resultado").innerHTML =
                    "Erro: " + dados.erro;
                }

            })

            .catch(erro => {
                document.getElementById("resultado").innerHTML =
                "Erro na comunicação com o servidor.";
            });

        });

    </script>

</body>
</html>
